name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # 現在の「latest」に対応する Isaac Sim バージョン。
  # 新しいメジャー/マイナー版に対応した際はここを更新する。
  # 過去バージョン（例: 5.1.0）のスナップショットは gh-pages 上に
  # mike が保持するため、この workflow では latest のみを再デプロイする。
  DOCS_VERSION: 6.0.1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and deploy versioned docs (mike)
        run: |
          git fetch origin gh-pages --depth=1 || true
          mike deploy --push --update-aliases "$DOCS_VERSION" latest
          mike set-default --push latest
