name: Deploy 5.1.0 docs to GitHub Pages

on:
  push:
    branches:
      - "5.1.0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # このブランチは Isaac Sim 5.1.0 向けドキュメントの保守ブランチ。
  # mike が gh-pages 上の 5.1.0/ ディレクトリのみを更新する
  # （latest = 6.0.1 は main ブランチの workflow が管理する）。
  DOCS_VERSION: 5.1.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and deploy 5.1.0 docs (mike)
        run: |
          git fetch origin gh-pages --depth=1 || true
          mike deploy --push "$DOCS_VERSION"
