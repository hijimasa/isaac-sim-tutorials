site_name: Isaac Sim Tutorials
site_url: "https://hijimasa.github.io/isaac-sim-tutorials/"
site_description: Isaac Sim チュートリアル集 / Isaac Sim Tutorial Collection
site_author: IR Lab

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: custom
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Noto Sans JP
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    logo: material/robot-industrial
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - def_list
  - footnotes

plugins:
  - search:
      lang:
        - en
        - ja
  - tags
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: ja
          default: false
          name: 日本語
          build: true
          nav:
            - ホーム: index.md
            - はじめに:
              - チュートリアル一覧: introduction/tutorial_list.md
            - Core API:
              - core_api/index.md
              - Hello World: core_api/01_hello_world.md
              - Hello Robot: core_api/02_hello_robot.md
              - コントローラの追加: core_api/03_adding_a_controller.md
              - マニピュレータロボットの追加: core_api/04_adding_a_manipulator_robot.md
              - 複数ロボットの追加: core_api/05_adding_multiple_robots.md
              - 複数タスクの実行: core_api/06_multiple_tasks.md
              - 属性の追加: core_api/07_adding_props.md
              - データロギング: core_api/08_data_logging.md
              - 変形可能物体（Deformable Body）: core_api/09_deformable_body.md
            - ロボットセットアップ:
              - robot_setup/index.md
              - ステージのセットアップ: robot_setup/01_stage_setup.md
              - シンプルなロボットの組み立て: robot_setup/02_assemble_robot.md
              - 基本ロボットのアーティキュレーション: robot_setup/03_articulate_robot.md
              - カメラとセンサーの追加: robot_setup/04_camera_sensors.md
              - モバイルロボットのリギング: robot_setup/05_rig_mobile_robot.md
              - Robot Schema の適用: robot_setup/05a_apply_robot_schema.md
              - マニピュレータのセットアップ: robot_setup/06_setup_manipulator.md
              - マニピュレータの設定: robot_setup/07_configure_manipulator.md
              - ロボット設定ファイルの生成: robot_setup/08_generate_robot_config.md
              - ピック＆プレースの例: robot_setup/09_pick_and_place.md
              - 閉ループ構造のリギング: robot_setup/10_closed_loop_structures.md
              - ジョイントドライブゲインの調整: robot_setup/11_joint_tuning.md
